[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "db-query"
version = "0.1.0"
description = "MCP server for read-only database queries via standard SQL syntax. Supports MySQL, PostgreSQL, and Oracle."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.10",
    "mo-sql-parsing>=4.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "pydantic>=2.0",
]

[project.optional-dependencies]
mysql = ["aiomysql>=0.2.0"]
postgresql = ["asyncpg>=0.29.0"]
oracle = ["oracledb>=2.0.0"]
all = ["aiomysql>=0.2.0", "asyncpg>=0.29.0", "oracledb>=2.0.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-mock>=3.10", "aiosqlite>=0.19"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
